<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Panel Konfiguracji</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            font-family:Verdana, Geneva, Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header{
            background-color: rgb(0, 0, 0);
            color: rgb(136, 0, 0);
            padding: 20px;
            text-align: center;
            font-size: 20px;
            
        }
        main{
            display: flex;
            flex: 1;
            text-align: center;
            flex-wrap: wrap;
        }
        section{
            flex: 1;
            display: flex;
            align-items: center;
            flex-direction: column;
            padding: 40px;
            color: rgb(206, 203, 203);
        }
        .left{
            background-color: rgb(107, 8, 8);
        }
        .right{
            background-color: rgb(95, 15, 15);
        }
        form{
            display: flex;
            flex-direction: column;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.644);
        }
        input{
            padding: 6px;
            background-color: rgb(107, 8, 8);
            color: rgb(206, 203, 203);
            font-size: 120%;
            border: none;
            margin: 8px;
            padding: 10px;
        }
        .div-input-row{
            display: flex;
            align-items: center;
        }
        label{
            min-width: 10%;
            max-width: 30%;
            text-align: left;
            margin-left: 10px;
        }
        button{
            padding: 10px;
            background-color: rgba(90, 88, 88, 0.781);
            color: rgb(206, 203, 203);
            border: none;
        }
        button:hover{
            background-color: rgba(255, 0, 0, 0.5);
            color: rgb(255, 255, 255);
        }
        .div-space{
            margin: 15px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Panel Konfiguracyjny</h1>
    </header>
    <main>
        
        <section class="left">
            <form>
                <h2>Ustawienia WiFi</h2>
                    <label for="ssid">SSID:</label>
                    <input type="text" name="ssid" id="ssid">
                <div class="div-space"></div>
                    <label for="pass">PASSWORD:</label>
                    <input type="password" name="pass" id="pass">
                    <div class="div-space"></div>
                    <div class="div-space"></div>
                <button type="button" onclick="sendWifiConfig()">Zapisz sieć</button>
                <p id="resultWifi"></p>
            </form>
        </section>

        <section class="right">
            <form id="form_right">
                <h2>Lista komend</h2>
                <div class="div-input-row">
                    <input type="text" id="command1_on"  placeholder="ON">
                    <input type="text" id="command1_off"  placeholder="OFF">
                    <label>#Komenda Pierwsza</label>
                </div>
                <div class="div-input-row">
                    <input type="text" id="command2_on"  placeholder="ON">
                    <input type="text" id="command2_off" placeholder="OFF">
                    <label>#Komenda Druga</label>
                </div>
                <div class="div-input-row">
                    <input type="text" id="command3_on" placeholder="ON">
                    <input type="text" id="command3_off" placeholder="OFF">
                    <label>#Komenda Trzecia</label>
                </div>
                <div class="div-input-row">
                    <input type="text" id="command4_on" placeholder="ON">
                    <input type="text" id="command4_off" placeholder="OFF">
                    <label>#Komenda Czwarta</label>
                </div class="div-input-row">
                <div class="div-space"></div>
                <button type="button" onclick="sendCommandConfig()">Zapisz Komendy</button>
                <p id="resultCommand"></p>
            </form>
            <div class="div-space"></div>
            <div class="div-space"></div>
        </section>
    </main>

    <script>

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function sendWifiConfig(){
            document.getElementById('resultWifi').textContent = "Przeslano";
            ssid = document.getElementById("ssid").value;
            pass = document.getElementById("pass").value;

            const formData = new FormData();
            formData.append("SSID", ssid);
            formData.append("PASS", pass);
            
            const result = await fetch(`/config/wifi`, {method: 'POST', body: formData});
            
            if(result.ok){
                const data = await result.json();
                document.getElementById('resultWifi').textContent = data.status;
                document.getElementById("ssid").value = "";
                document.getElementById("pass").value = "";
            }
            else{
                const text = await result.text();
                document.getElementById('resultWifi').textContent = text;
            }
            
            await delay(5000);
            document.getElementById('resultWifi').textContent = "";
        }

        async function sendCommandConfig() {
            command1_on = document.getElementById("command1_on").value;
            command1_off = document.getElementById("command1_off").value;

            command2_on = document.getElementById("command2_on").value;
            command2_off = document.getElementById("command2_off").value;

            command3_on = document.getElementById("command3_on").value;
            command3_off = document.getElementById("command3_off").value;

            command4_on = document.getElementById("command4_on").value;
            command4_off = document.getElementById("command4_off").value;

            if((command1_on == "" && command1_off != "") || (command1_on != "" && command1_off == "") ||
                (command2_on == "" && command2_off != "") || (command2_on != "" && command2_off == "") ||
                (command3_on == "" && command3_off != "") || (command3_on != "" && command3_off == "") ||
                (command4_on == "" && command4_off != "") || (command4_on != "" && command4_off == "")){
                    document.getElementById('resultCommand').textContent = "Wypełnij oba pola danej komendy";
            }
            else if(command1_on == "" && command1_off == "" &&
                    command2_on == "" && command2_off == "" && 
                    command3_on == "" && command3_off == "" && 
                    command4_on == "" && command4_off == ""){
                        document.getElementById('resultCommand').textContent = "Wypełnij przynajmniej jeden wiersz";
                    }
            else{
                document.getElementById('resultCommand').textContent = "";
                const formData = new FormData();

                if (command1_on != ""){
                    formData.append("command1_on", command1_on);
                    formData.append("command1_off", command1_off);
                }
                if (command2_on != ""){
                    formData.append("command2_on", command2_on);
                    formData.append("command2_off", command2_off);
                }
                if (command3_on != ""){
                    formData.append("command3_on", command3_on);
                    formData.append("command3_off", command3_off);
                }
                if (command4_on != ""){
                    formData.append("command4_on", command4_on);
                    formData.append("command4_off", command4_off);
                }

                const result = await fetch(`/config/commands`, {method: 'POST', body: formData});
                const text = await result.text();
                
                if(result.ok)
                    showCurrentCommands();

                document.getElementById('resultCommand').textContent = text;
                await delay(5000);
                document.getElementById('resultCommand').textContent = "";
            }
        }
        async function showCurrentCommands() {
            
            const response = await fetch('/api/commands', {method: 'POST'});
            const data = await response.json();

            command1_on = data.command1_on;
            command1_off = data.command1_off;

            command2_on = data.command2_on;
            command2_off = data.command2_off;

            command3_on = data.command3_on;
            command3_off = data.command3_off;

            command4_on = data.command4_on;
            command4_off = data.command4_off;

            document.getElementById("command1_on").value = command1_on;
            document.getElementById("command1_off").value = command1_off;

            document.getElementById("command2_on").value = command2_on;
            document.getElementById("command2_off").value = command2_off;

            document.getElementById("command3_on").value = command3_on;
            document.getElementById("command3_off").value = command3_off;

            document.getElementById("command4_on").value = command4_on;
            document.getElementById("command4_off").value = command4_off;

        }

        window.onload = async () => {
            showCurrentCommands();
        };
    </script>

</body>
</html>
